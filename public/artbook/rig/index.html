<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link rel="icon" href="data:,"><title>ASHVEIL 파종기 정면 관절 시제품</title>
<style>body{margin:0;padding:24px;background:#161914;color:#d4cfb8;font:16px system-ui}main{max-width:1100px;margin:auto}h1{font-size:24px}p{line-height:1.6}button,select{background:#33382d;color:inherit;border:1px solid #787458;padding:10px;margin:3px;font:inherit}canvas{display:block;width:100%;max-width:1000px;border:1px solid #777157;margin-top:16px;image-rendering:pixelated}label{white-space:nowrap}output{display:block;padding:12px 0}.limit{color:#c7ae81}a{color:#d5b65c}</style>
<main><h1>파종기 · 정면 관절 시제품</h1><p><a href="../../">게임 실행</a> · <a href="../motion/">캐릭터 동작</a> · <a href="https://github.com/RoastFried-RF/ashveil/blob/main/docs/sower-v356.md">구현·검토 기록</a></p><p>원화 4영역(차체·위 링크·아래 링크·발판)을 공유합니다. 발은 지지 중 지면에 고정되고, 이동 거리에 따라 한 발씩 회복합니다. 새로 그린 보행 프레임은 0개입니다.</p>
<div><button id="play">이동 재개</button><button id="step">0.1초 이동</button><button id="reset">초기 자세</button><label>이동 <select id="heading"><option value="0">앞</option><option value="1">우대각</option><option value="2">오른쪽</option><option value="3">좌대각</option><option value="4">뒤</option></select></label><label>속도 <select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><label><input id="joints" type="checkbox">관절 표시</label><button id="capture">관찰 기록 <span id="captures">0</span></button></div>
<canvas id="stage" width="1000" height="560" aria-label="파종기 정면 보행 시제품"></canvas><output id="stat"></output>
<p class="limit">정면만 제작했습니다. 뒤 힙은 추정 배치이며, 고정 길이 부품의 투영·관절 가림·도색된 조명 회전은 검토 중입니다. 지지 여유가 음수면 가정한 무게중심이 지지 다각형 밖에 있다는 뜻입니다. 실제 균형·파종·전투나 출시 승인을 뜻하지 않습니다.</p></main><script type="module" src="workbench.js"></script></html>
