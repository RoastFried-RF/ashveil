<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>ASHVEIL 원화 도감</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#161719;color:#d5ceba}*{box-sizing:border-box}body{margin:0}header{padding:24px max(20px,4vw);border-bottom:1px solid #66604f;background:#202123}h1{margin:0 0 8px;font:28px Georgia,serif;letter-spacing:3px}p{line-height:1.65;font-size:13px;max-width:1050px}a{color:#c2b88c}nav{display:flex;gap:7px;flex-wrap:wrap;margin:18px 0 10px}button,input,select{font:inherit;color:inherit;border:1px solid #6b6654;background:#292a2c;border-radius:2px;padding:8px 12px}button{cursor:pointer}button[aria-pressed=true]{background:#595442;color:#fff4d5;border-color:#aea17b}label{font-size:13px;display:inline-flex;gap:8px;align-items:center;margin-right:15px;margin-bottom:8px}input{min-width:240px}main{padding:20px max(20px,4vw)}.tools{display:flex;align-items:center;flex-wrap:wrap;gap:8px}#count{font-size:13px;color:#aaa796}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(235px,1fr));gap:12px;margin:18px 0}.card{background:#222427;border:1px solid #4b4c46;min-width:0}.view{height:214px;display:flex;align-items:center;justify-content:center;background-color:#303335;background-image:linear-gradient(45deg,#333639 25%,transparent 25%),linear-gradient(-45deg,#333639 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#333639 75%),linear-gradient(-45deg,transparent 75%,#333639 75%);background-size:24px 24px;background-position:0 0,0 12px,12px -12px,-12px 0;overflow:hidden}.frame{position:relative;overflow:hidden;flex:none;image-rendering:pixelated}.frame img{position:absolute;image-rendering:pixelated;max-width:none;max-height:none}.direct{max-width:92%;max-height:200px;image-rendering:pixelated;object-fit:contain}.info{padding:12px;min-height:101px}.info b{font-size:14px;font-weight:600;display:block;margin-bottom:6px}.info small{display:block;color:#aaa99b;font:11px/1.6 ui-monospace,monospace;overflow-wrap:anywhere}.new{color:#d9c58a}.pager{display:flex;gap:10px;align-items:center;margin:20px 0 40px}.error{color:#f0af98}footer{font-size:12px;padding:0 4vw 32px;color:#a39e90}@media(max-width:600px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}.view{height:170px}.info{padding:8px}.info b{font-size:12px}header,main{padding-inline:12px}input{min-width:190px}}
</style>
<header><h1>ASHVEIL · 원화 도감</h1><p>직접 만든 캐릭터·초상·물품·지형·UI를 살펴보는 개발 미리보기입니다. 캐릭터의 방향과 동작을 바꿔 볼 수 있습니다. 이 도감은 실제 게임의 시간·시야·발견·장비 상태를 진행하지 않습니다.</p><p><a href="../">게임으로 돌아가기</a> · <a href="https://github.com/RoastFried-RF/ashveil/blob/main/docs/wiki-resource-study-v319.md">조사·제작 기록</a> · 참고 자료: <a href="https://stoneshard.com/wiki/Enemies">Stoneshard 적 목록</a>, <a href="https://stoneshard.com/wiki/Stoneshard_Wiki">위키</a></p><nav id="tabs" aria-label="원화 분류"></nav><div class="tools"><label>검색<input id="search" type="search" placeholder="이름·종류·그림 키"></label><label>확대<select id="zoom"><option value="1">1배</option><option value="2" selected>2배</option><option value="3">3배</option><option value="4">4배</option></select></label><label>방향<select id="direction"><option value="down">앞</option><option value="left">왼쪽</option><option value="right">오른쪽</option><option value="up">뒤</option></select></label><label>동작<select id="mode"><option value="idle">정지</option><option value="walk">걷기</option><option value="attack">공격</option></select></label><button id="playing" type="button" aria-pressed="true">동작 재생 중</button><label>프레임<select id="frame"><option value="0">1</option><option value="1">2</option><option value="2">3</option><option value="3">4</option><option value="4">5</option><option value="5">6</option></select></label><label><input id="fresh" type="checkbox" style="min-width:0">이번 원화 묶음만</label></div></header>
<main><p id="count" aria-live="polite">원화를 불러오는 중…</p><div id="grid" class="grid"></div><div class="pager"><button id="previous">이전</button><span id="page"></span><button id="next">다음</button></div></main><footer>이 도감에는 ASHVEIL 자체 원본만 표시합니다. 참고 게임의 이미지 픽셀은 포함하지 않습니다. 실제 장면의 조명·그림자·장비·겹침은 게임 안에서 별도로 표시됩니다.</footer>
<script type="module">
const labels={actors:'캐릭터',portraits:'픽셀 초상',items:'물품',terrain:'지형·사물',abilities:'능력',ui:'UI',frames:'전체 프레임'},limit=36
let data,kind='actors',page=0,views=[],lastFrame=-1,playing=true
const el=id=>document.getElementById(id),base=new URL('../',location.href),sheetSizes=new Map()
function imageUrl(path){return new URL(path,base).href}
function frameElement(key,scale=1){
 const f=data.frames[key];if(!f)return null
 const size=sheetSizes.get(f[0]),zoom=Number(el('zoom').value),available=Math.min(222/f[3],196/f[4]),fit=Math.min(zoom*scale,available>=1?Math.floor(available):available),node=document.createElement('div'),img=document.createElement('img')
 node.className='frame';node.style.width=f[3]*fit+'px';node.style.height=f[4]*fit+'px';img.src=imageUrl(data.sheets[f[0]]);img.width=size.w;img.height=size.h;img.style.width=size.w*fit+'px';img.style.height=size.h*fit+'px';img.style.left=-f[1]*fit+'px';img.style.top=-f[2]*fit+'px';img.alt='';img.draggable=false;node.append(img);return{node,img,fit}
}
function pose(entry,frame){const c=data.characters[entry.character],mode=el('mode').value,dir=el('direction').value,frames=c?.[mode]?.[dir]??c?.idle?.[dir];return frames?.[frame%frames.length]??entry.frame}
function filtered(){const query=el('search').value.trim().toLowerCase();return data.entries.filter(entry=>entry.kind===kind&&(!query||(entry.label+' '+entry.id+' '+(entry.frame??'')).toLowerCase().includes(query))&&(!el('fresh').checked||(entry.url??data.sheets[data.frames[entry.frame]?.[0]]??'').includes('direction-v319')))}
function render(){
 const entries=filtered(),pages=Math.max(1,Math.ceil(entries.length/limit));page=Math.min(page,pages-1);el('grid').replaceChildren();views=[]
 for(const entry of entries.slice(page*limit,(page+1)*limit)){
  const card=document.createElement('article'),view=document.createElement('div'),info=document.createElement('div'),title=document.createElement('b'),id=document.createElement('small'),detail=document.createElement('small');card.className='card';view.className='view';info.className='info';title.textContent=entry.label;id.textContent=entry.id
  const key=entry.kind==='actors'?pose(entry,0):entry.frame,f=key&&data.frames[key],path=entry.url??(f&&data.sheets[f[0]])
  if(f){const drawn=frameElement(key);view.append(drawn.node);if(entry.kind==='actors')views.push({entry,drawn,key});detail.textContent=`${f[3]}×${f[4]} px`+(entry.grid?' · 가방 '+entry.grid.join('×')+'칸':'')+(entry.kind==='actors'?' · 게임 표시 '+entry.scale+'배':entry.kind==='terrain'?' · 대표 프레임':'')}
  else if(path){const img=document.createElement('img');img.src=imageUrl(path);img.className='direct';img.loading='lazy';img.alt='';view.append(img)}
  else{view.textContent='호환 표현 · 현재 프레임 없음';view.classList.add('error')}
  if(path?.includes('direction-v319')){const badge=document.createElement('small');badge.className='new';badge.textContent='새 원본 · v0.319';info.append(badge)}
  info.append(title,id,detail);card.append(view,info);el('grid').append(card)
 }
 for(const button of el('tabs').children)button.setAttribute('aria-pressed',String(button.dataset.kind===kind))
 el('count').textContent=`${labels[kind]} ${entries.length}개 · ${data.version}`+(kind==='frames'?' · 이전 호환 프레임 포함':'');el('page').textContent=`${page+1} / ${pages}`;el('previous').disabled=page===0;el('next').disabled=page===pages-1;lastFrame=-1
}
function animate(time){const step=playing?Math.floor(time/140):Number(el('frame').value);if(step!==lastFrame&&data){lastFrame=step;for(const view of views){const key=pose(view.entry,step);if(key===view.key)continue;const f=data.frames[key];if(!f)continue;view.key=key;view.drawn.img.style.left=-f[1]*view.drawn.fit+'px';view.drawn.img.style.top=-f[2]*view.drawn.fit+'px'}}requestAnimationFrame(animate)}
try{
 const response=await fetch('./catalog.json');if(!response.ok)throw Error('HTTP '+response.status);data=await response.json()
 for(const[sheet,x,y,w,h]of Object.values(data.frames)){const prior=sheetSizes.get(sheet)??{w:0,h:0};sheetSizes.set(sheet,{w:Math.max(prior.w,x+w),h:Math.max(prior.h,y+h)})}
 for(const[key,label]of Object.entries(labels)){const button=document.createElement('button');button.type='button';button.dataset.kind=key;button.textContent=label;button.addEventListener('click',()=>{kind=key;page=0;render()});el('tabs').append(button)}
 for(const id of ['search','zoom','direction','mode','fresh','frame'])el(id).addEventListener(id==='search'?'input':'change',()=>{page=0;render()})
 el('playing').onclick=()=>{playing=!playing;el('playing').setAttribute('aria-pressed',String(playing));el('playing').textContent=playing?'동작 재생 중':'동작 정지';lastFrame=-1};el('frame').addEventListener('change',()=>{playing=false;el('playing').setAttribute('aria-pressed','false');el('playing').textContent='동작 정지';lastFrame=-1});el('previous').onclick=()=>{page--;render()};el('next').onclick=()=>{page++;render()};render();requestAnimationFrame(animate)
}catch(error){el('count').textContent='원화를 불러오지 못했습니다: '+error.message;el('count').classList.add('error')}
</script></html>
