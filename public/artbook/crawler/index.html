<h1>관로 지네 · 체절과 다리</h1><p>게임과 같은 렌더러로 머리, 여덟 체절과 열여섯 다리를 조립합니다. 이 화면의 조작은 원화를 살펴보는 표현 예시입니다. 실제 전투·독·지형 판정과 생물 상태는 게임에서 결정됩니다.</p><p><a href="../../">게임</a> · <a href="../">원화 도감</a></p>
<div class="controls"><button id="go">연속 이동</button><button id="step">한 칸 이동</button><button id="stop">정지</button><button id="east">오른쪽</button><button id="diagonal">오른쪽 아래</button><button id="turn">왼쪽으로 90°</button><button id="attack">턱 공격</button><button id="hurt">피격</button><button id="reset">처음 위치</button><label>표현 속도 <select id="speed"><option value="0">일시정지</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><label>위치 <select id="mode"><option value="floor">바닥</option><option value="ceiling">천장</option></select></label><label><input id="leg-missing" type="checkbox">첫 체절 왼다리 소실</label><label><input id="leg-damage" type="checkbox">첫 체절 오른다리 파괴</label><label>소실 체절 <select id="segment-missing"><option value="">없음</option><option value="Segment4">제4체절과 후방</option><option value="TailSegment8">꼬리</option></select></label><label><input id="dead" type="checkbox">사체 표현</label><label><input id="fog" type="checkbox">벽·시야 가림 예시</label><label>확대 <select id="zoom"><option value="3">3×</option><option value="5" selected>5×</option><option value="8">8×</option></select></label></div>
<output id="stat"></output><div id="stage"></div><p>자체 원문 1장·분리 영역 6개를 공유합니다. 한 등 시점을 회전·반전하며, 접힌 밑면과 천장 전용 원화는 추가 제작되지 않았습니다. 소켓과 발끝은 2D 투영 기준이며 관절 물리나 실제 다리 접촉을 증명하지 않습니다.</p><details><summary>표현 관찰</summary><pre id="audit"></pre></details></html>
