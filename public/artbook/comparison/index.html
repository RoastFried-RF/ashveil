<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>ASHVEIL · 원화 전후 비교</title>
<style>
:root{color-scheme:dark;background:#151719;color:#d5cdbb;font-family:system-ui,sans-serif}*{box-sizing:border-box}body{margin:0}main{max-width:1504px;margin:auto;padding:28px}h1{font:28px Georgia,serif;letter-spacing:2px;margin:0 0 14px}p{font-size:14px;line-height:1.7;max-width:1000px;color:#b7b0a0}a{color:#d0bb87}.controls{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:22px 0}label{font-size:13px;display:flex;gap:8px;align-items:center}button,select{font:inherit;background:#292b2c;color:#ded4bd;border:1px solid #716b58;padding:8px 12px;cursor:pointer}.slider{flex:1;min-width:250px}.slider input{flex:1;min-width:150px;accent-color:#c6ab70}.stage{position:relative;overflow:hidden;border:1px solid #635b4a;background:#08090a}.stage img{display:block;width:100%;height:auto}.stage .after{position:absolute;inset:0;clip-path:inset(0 50% 0 0)}.line{position:absolute;top:0;bottom:0;left:50%;width:2px;background:#d4bd83;pointer-events:none}.tag{position:absolute;bottom:12px;padding:6px 9px;background:#111c;color:#e3d6b8;border:1px solid #615a4a;font-size:12px;pointer-events:none}.tag.old{right:12px}.tag.new{left:12px}.foot{font-size:12px;color:#9a968b;margin-top:18px}#status{min-height:20px}@media(max-width:600px){main{padding:14px}h1{font-size:23px}.controls{gap:9px}label{font-size:12px}button,select{padding:7px}.tag{font-size:10px;bottom:6px}.stage{margin-inline:-10px}}
</style>
<main><h1>ASHVEIL · 원화 전후 비교</h1><p>같은 초기 장면을 실제 게임에서 불러와 촬영했습니다. 슬라이더를 움직여 인물의 형태와 옷 주름, 바닥과 벽의 질감을 비교할 수 있습니다. 왼쪽은 새 원화, 오른쪽은 이전 버전입니다.</p><p><a href="../">원화 도감</a> · <a href="../../">게임으로 돌아가기</a> · <a href="https://github.com/RoastFried-RF/ashveil/blob/main/docs/art-quality-v321.md">제작·화면 확인 기록</a></p>
<div class="controls"><label>장면<select id="scene"><option value="room">폐수도원 석실</option><option value="field">고원의 길</option><option value="torch">횃불 아래</option></select></label><label>화면<select id="size"><option value="1440">1440×1080</option><option value="1366">1366×768</option></select></label><button id="old">이전만</button><button id="new">새 원화만</button><label class="slider">새 원화<input id="split" type="range" min="0" max="100" value="50"><output id="value">50%</output></label></div>
<p id="status" aria-live="polite">화면을 불러오는 중…</p><div class="stage"><img id="before" alt="이전 v0.320 게임 화면"><img id="after" class="after" alt="개선한 v0.321 게임 화면"><div id="line" class="line"></div><span class="tag new">새 원화 · v0.321</span><span class="tag old">이전 · v0.320</span></div><p class="foot">비교를 위한 유한한 초기 장면입니다. 실제 타이틀의 이어하기와 게임 렌더러를 사용했으며 로드 뒤 세계를 덮어쓰지 않았습니다. 자연 탐험·전투 평가나 v1.0.0 완료를 뜻하지 않습니다.</p></main>
<script>
const el=id=>document.getElementById(id)
function split(){const value=el('split').value;el('after').style.clipPath=`inset(0 ${100-value}% 0 0)`;el('line').style.left=value+'%';el('value').textContent=value+'%'}
function load(){el('status').textContent='화면을 불러오는 중…';const scene=el('scene').value,size=el('size').value;el('before').src=`before-${scene}-${size}.png`;el('after').src=`after-${scene}-${size}.png`;split()}
for(const id of ['scene','size'])el(id).addEventListener('change',load)
for(const id of ['before','after']){el(id).addEventListener('load',()=>{if(el('before').complete&&el('after').complete)el('status').textContent='같은 장면의 원화·표시 변경 비교'});el(id).addEventListener('error',()=>el('status').textContent='화면을 불러오지 못했습니다. 잠시 뒤 다시 열어 주세요.')}
el('split').addEventListener('input',split);el('old').onclick=()=>{el('split').value=0;split()};el('new').onclick=()=>{el('split').value=100;split()};load()
</script></html>
