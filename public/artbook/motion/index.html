<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>ASHVEIL · 동작 비교</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#17191b;color:#d6cebb}*{box-sizing:border-box}body{margin:0}main{max-width:1250px;margin:auto;padding:28px}h1{font:29px Georgia,serif;letter-spacing:2px}p{font-size:14px;line-height:1.7;max-width:1060px;color:#b8b2a4}a{color:#d6bc81}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:24px 0}label{font-size:13px;display:flex;gap:8px;align-items:center}select,button{background:#2d3031;border:1px solid #746b55;color:#e4d7bb;padding:8px 12px;font:inherit}button{cursor:pointer}input{accent-color:#c6ab70}.scrub{flex:1;min-width:230px}.scrub input{flex:1}.stages{display:grid;grid-template-columns:1fr 1fr;gap:16px}.stage{border:1px solid #58574c;background:#26292b;min-width:0}.stage h2{font:17px Georgia,serif;margin:0;padding:14px;border-bottom:1px solid #514e43}.stage canvas{display:block;width:100%;height:auto;image-rendering:pixelated}.stat{padding:12px;font:12px/1.7 ui-monospace,monospace;color:#bcb39d;min-height:64px}.foot{font-size:12px;color:#97978d;margin-top:22px}.status{min-height:24px}@media(max-width:650px){main{padding:16px}.stages{gap:12px;grid-template-columns:1fr}.stage h2{font-size:14px;padding:10px}.stat{padding:8px;font-size:10px}.controls{gap:9px}select,button{padding:7px}h1{font-size:24px}}

<main><h1>ASHVEIL · 동작 비교</h1><p>이전과 현재의 기본 재생 주기를 비교합니다. 방향과 행동을 바꾸거나 연결 동작을 골라 발의 교대, 준비 자세, 회복과 정지를 살펴볼 수 있습니다.</p><p><a href="../../">게임 실행</a> · <a href="../">원화 도감</a> · <a href="https://github.com/RoastFried-RF/ashveil/blob/main/docs/motion-v323.md">제작 기록</a></p>
<div class="controls"><label>캐릭터<select id="model"></select></label><label>방향<select id="direction"><option value="down">앞</option><option value="left">왼쪽</option><option value="right">오른쪽</option><option value="up">뒤</option></select></label><label>동작<select id="motion"><option value="sequence">연결 동작</option></select></label><label>연결<select id="sequence"><option value="travel">걷기 → 정지</option><option value="combat">공격 → 방어·피격 → 회복</option><option value="crouch">웅크림 → 이동 → 서기</option><option value="work">작업 → 사용 → 정지</option><option value="ground">쓰러짐 → 수면 → 기상</option><option value="ranged">조준·사격 → 던지기</option></select></label></div>
<div class="controls"><label>주무기<select id="weapon"><option value="">맨손</option></select></label><label>보조 손<select id="offhand"><option value="">비움</option></select></label><label>공격 방식<select id="attack-mode"><option value="auto">기본</option></select></label></div>
<div class="controls"><button id="play" type="button">일시 정지</button><button id="previous" type="button">한 프레임 전</button><button id="next" type="button">한 프레임 뒤</button><label>속도<select id="speed"><option value="0.25">0.25배</option><option value="0.5">0.5배</option><option value="1" selected>1배</option><option value="2">2배</option></select></label><label class="scrub">진행<input id="scrub" type="range" min="0" max="1000" value="0"><output id="progress">0%</output></label></div>
<p id="status" class="status" aria-live="polite">원화를 불러오는 중…</p><div class="stages"><section class="stage"><h2>이전 · v0.322</h2><canvas id="before" width="600" height="500" aria-label="이전 캐릭터 동작"></canvas><div id="before-stat" class="stat"></div></section><section class="stage"><h2>현재 · v0.336</h2><canvas id="after" width="600" height="500" aria-label="개선한 캐릭터 동작"></canvas><div id="after-stat" class="stat"></div></section></div>
<p class="foot">원화·무기·동작 연결을 보는 미리보기입니다. 장비 선택은 이 페이지에서만 적용됩니다. 실제 게임의 시간·시야·물품은 바꾸지 않습니다. 이전에 전용 포즈가 없던 행동은 정지 포즈로 표시하며 실제 게임의 조명·장비·피격 효과와는 구분합니다.</p></main>
<script type="module">
import {heldPose,supportHand,attackBodyPhase,attackDuration,actionStage} from "./equipment-motion.js"
import {medicalGripPosition} from '../medical/medical-motion.js'
const el=id=>document.getElementById(id),labels={idle:'정지·호흡',walk:'걷기',attack:'근접 공격',block:'방어·받아넘김',hurt:'피격·회복',crouchDown:'웅크리기',crouchWalk:'웅크려 걷기',stand:'서기',work:'작업',wallow:'진흙 뒹굴기',use:'물품 사용',fall:'쓰러짐',rise:'일어나기',sleep:'수면',shoot:'조준·사격',throw:'던지기',interact:'상호작용'},roleLabels={wanderer:'떠돌이',guard:'경비',reaver:'약탈자',worker:'노동자',healer:'치료사',trader:'상인',patient:'그늘 사람',spore:'감염 순례자',ashhorn_stag:'재뿔사슴',tuskhog:'엄니돼지',hound:'재늑대',amalgam:'융합체',drone:'수리 드론',rat:'굴쥐',leech:'늪거머리'}
const sequences={travel:[['idle',500],['walk',1800],['idle',800]],combat:[['idle',450],['attack',280],['block',220],['attack',280],['hurt',240],['idle',700]],crouch:[['idle',450],['crouchDown',180],['crouchWalk',1800],['stand',180],['idle',650]],work:[['idle',400],['work',2100],['use',650],['idle',650]],ground:[['idle',450],['fall',420],['sleep',2400],['rise',360],['idle',700]],ranged:[['idle',450],['shoot',340],['idle',250],['throw',340],['interact',380],['idle',700]]}
const base=new URL('../../',location.href),images=new Map();let data,elapsed=0,last=0,playing=true,loading=0
const clip=(set,role,mode,dir)=>set.characters[role]?.[mode]?.[dir]??set.characters[role]?.motions?.[mode]?.[dir]
function selected(slot=0){return data.equipment.find(item=>item.id===el(slot?'offhand':'weapon').value)}
function style(){const item=selected();return item?.modes.find(m=>m.id===el('attack-mode').value)?.style??item?.style??'unarmed'}
function melee(){const main=selected();if(main?.ranged)return{style:'unarmed',slot:null};for(const slot of[0,1]){const item=selected(slot);if(item?.modes.length&&!item.ranged)return{style:slot===0?style():item.modes[0].style,slot,item}}return{style:'unarmed',slot:null}}
function duration(set,mode){const c=set.characters[el('model').value];if(set===data.before)return data.beforeDurations[mode]??data.motionDurations[mode];if(mode==='attack')return c.motionDurations?.attack??attackDuration(melee().style,melee().item);return c.gait?.[mode]??c.motionDurations?.[mode]??data.motionDurations[mode]}
function timeline(){const mode=el('motion').value;return mode==='sequence'?sequences[el('sequence').value].map(([m,n])=>[m,['walk','idle','crouchWalk','work','sleep'].includes(m)?n:duration(data.after,m)]):[[mode,duration(data.after,mode)]]}
const durationFor=mode=>duration(data.after,mode)
function position(){const line=timeline(),duration=line.reduce((n,row)=>n+row[1],0);let at=((elapsed%duration)+duration)%duration;for(const[mode,length]of line){if(at<length)return{mode,phase:at/durationFor(mode),local:at,duration};at-=length}return{mode:'idle',phase:0,local:0,duration}}
async function texture(path){if(images.has(path))return images.get(path);const img=new Image();images.set(path,img);loading++;el('status').textContent='선택한 원화를 불러오는 중…';img.src=new URL(path,base).href;try{await img.decode()}catch{el('status').textContent='원화를 불러오지 못했습니다.'}finally{loading--}return img}
async function loadRole(){const role=el('model').value;for(const set of[data.before,data.after]){const c=set.characters[role],keys=new Set();if(!c)continue;for(const block of[c.walk,c.idle,c.attack,...Object.values(c.motions??{})])if(block)for(const frames of Object.values(block))for(const key of frames)keys.add(set.frames[key][0]);for(const item of[selected(),selected(1)])if(item)keys.add(set.frames[item.sprite][0]);await Promise.all([...keys].map(key=>texture(set.sheets[key])))}if(!loading)el('status').textContent='발 기준은 같은 위치에 고정됩니다. 1배는 각 버전의 기본 재생 시간입니다. 무기와 공격 방식을 바꿔 비교할 수 있습니다.'}
function draw(set,name,mode,phase){
 const missing=!set.characters[el('model').value];if(missing){const canvas=el(name),ctx=canvas.getContext('2d');ctx.fillStyle='#272a2c';ctx.fillRect(0,0,600,500);ctx.fillStyle='#c8b88f';ctx.font='17px system-ui';ctx.textAlign='center';ctx.fillText('이전 버전에 전용 원화가 없었습니다',300,250);el(name+'-stat').textContent='신규 생물 · 이전 원화를 대체하지 않았습니다';canvas.dataset.mode='missing';return}
 const role=el('model').value,dir=el('direction').value,c=set.characters[role],original=clip(set,role,mode,dir),frames=original??c.idle[dir],loop=['idle','walk','crouchWalk','work','sleep'].includes(mode),p=loop?phase%1:Math.min(.999999,phase),bodyPhase=mode==='attack'&&name==='after'?attackBodyPhase(p):p,index=Math.min(frames.length-1,Math.floor(bodyPhase*frames.length)),key=frames[index],f=set.frames[key],transform=c.frameTransforms?.[key],anchor=transform?.anchor??c.anchor,scale=transform?.scale??c.renderScale??.72,img=images.get(set.sheets[f[0]]),canvas=el(name),ctx=canvas.getContext('2d'),zoom=Math.min(8,310/(c.headOffset??33)),x=300,y=380
 ctx.clearRect(0,0,600,500);ctx.fillStyle='#272a2c';ctx.fillRect(0,0,600,500);ctx.strokeStyle='#404340';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(40,y+.5);ctx.lineTo(560,y+.5);ctx.moveTo(x+.5,35);ctx.lineTo(x+.5,430);ctx.stroke();ctx.fillStyle='#a28c5e';ctx.fillRect(x-3,y-1,6,3)
 const hands=previewHands(set,name,mode,p,key);for(const hand of hands)if(hand.behind)drawHand(ctx,set,hand,x,y,zoom)
 if(img?.complete&&img.naturalWidth){ctx.imageSmoothingEnabled=false;ctx.save();ctx.translate(x,y);ctx.scale(transform?.flipX?-1:1,1);ctx.drawImage(img,f[1],f[2],f[3],f[4],-anchor[0]*f[3]*scale*zoom,-anchor[1]*f[4]*scale*zoom,f[3]*scale*zoom,f[4]*scale*zoom);ctx.restore()}
 for(const hand of hands)if(!hand.behind)drawHand(ctx,set,hand,x,y,zoom)
 el(name+'-stat').textContent=`${labels[mode]} · ${original?frames.length+'프레임':'전용 포즈 없음'} · ${index+1}/${frames.length} · ${Math.round(duration(set,mode))}ms`+(mode==='attack'?' · '+({prepare:'준비',strike:'타격',followThrough:'후속 동작',recover:'회복'}[actionStage(p)]):'')
 canvas.dataset.mode=mode;canvas.dataset.key=key;canvas.dataset.count=String(original?frames.length:0);canvas.dataset.index=String(index);canvas.dataset.duration=String(duration(set,mode));canvas.dataset.style=mode==='attack'?melee().style:mode==='shoot'?'shoot':mode==='throw'?'throw':''
}
function updateAttackModes(){el('attack-mode').replaceChildren(new Option('기본','auto'));for(const mode of selected()?.modes??[])el('attack-mode').add(new Option(mode.label,mode.id))}
function previewHands(set,name,mode,phase,key){
 const c=set.characters[el('model').value];if(!c?.heldItems)return[];const dir=el('direction').value,vector={right:{x:1,y:0},left:{x:-1,y:0},up:{x:0,y:-1},down:{x:0,y:1}}[dir],main=selected(),chosen=melee(),two=main?.twoHanded&&['attack','shoot','block','work'].includes(mode)&&(mode!=='attack'||chosen.slot===0),rows=[]
 for(const slot of[0,1]){const item=selected(slot);if(!item||slot&&two)continue;const t=c.frameTransforms?.[key],registered=name==='after'?set.grips?.[key]:undefined,grip=registered?.[slot===0?'main':'off'];if(registered&&!grip)continue
 const f=set.frames[key],source=grip&&t?medicalGripPosition(grip.point,{width:f[3],height:f[4],...t},mode==='crouchWalk'):undefined,wrist=source?[source.x,source.y]:slot===0&&t?.mainHand?[t.mainHand[0]*(t.flipX?-1:1),t.mainHand[1]]:undefined,action={style:mode==='shoot'?'shoot':mode==='throw'?'throw':chosen.style,slot:mode==='attack'?chosen.slot:0,weapon:mode==='attack'?chosen.item:main,direction:dir,vector};let pose
 if(name==='after')pose=heldPose({item,slot,direction:dir,mode,phase,stride:phase*2,moving:['walk','crouchWalk'].includes(mode),crouched:mode==='crouchWalk',wrist,sourceGrip:!!source,action})
 else pose={x:wrist?.[0]??(dir==='left'?-5:dir==='right'?5:slot?6:-6),y:wrist?.[1]??-15,angle:item.axis+.12+(mode==='attack'&&slot===0?Math.sin(phase*Math.PI)*.9:0),visible:true,behind:dir==='up',alpha:1}
 const supportPalm=registered?.off&&t?medicalGripPosition(registered.off.point,{width:f[3],height:f[4],...t},mode==='crouchWalk'):undefined
 if(pose.visible)rows.push({...pose,item,legacy:name==='before',support:slot===0&&two&&(!registered||!!supportPalm),supportPalm,gripColor:grip?.color,ratio:(c.headOffset??35)/35})
 }return rows
}
function drawHand(ctx,set,hand,x,y,zoom){
 const item=hand.item,f=set.frames[item.sprite],img=images.get(set.sheets[f[0]]);if(!img?.naturalWidth)return;const grip=hand.legacy?[.5,.78]:item.grip,size=(hand.legacy?Math.min(22,item.length):item.length)*hand.ratio/Math.max(f[3],f[4])*zoom
 ctx.save();ctx.translate(x+hand.x*zoom,y+hand.y*zoom);ctx.rotate(hand.angle-item.axis);ctx.globalAlpha=hand.alpha;ctx.imageSmoothingEnabled=false;ctx.drawImage(img,f[1],f[2],f[3],f[4],-grip[0]*f[3]*size,-grip[1]*f[4]*size,f[3]*size,f[4]*size);ctx.restore();ctx.fillStyle='#'+(hand.gripColor??0x807261).toString(16).padStart(6,'0');ctx.beginPath();ctx.ellipse(x+hand.x*zoom,y+hand.y*zoom,.8*hand.ratio*zoom,.65*hand.ratio*zoom,0,0,Math.PI*2);ctx.fill()
 if(hand.support&&!hand.legacy){const p=hand.supportPalm??supportHand(hand,item);ctx.fillRect(x+p.x*zoom-zoom,y+p.y*zoom-zoom,zoom*2,zoom*2)}
}
function render(now){if(data){if(last&&playing)elapsed+=Math.min(48,now-last)*Number(el('speed').value);const pos=position();draw(data.before,'before',pos.mode,pos.local/duration(data.before,pos.mode));draw(data.after,'after',pos.mode,pos.phase);el('scrub').value=String((elapsed%pos.duration)/pos.duration*1000);el('progress').textContent=Math.floor(Number(el('scrub').value)/10)+'%'}last=now;requestAnimationFrame(render)}
function pause(){playing=false;el('play').textContent='재생'}
function step(offset){
 pause();const previous=position();if(el('motion').value==='sequence'){el('motion').value=previous.mode;elapsed=Math.min(.999999,previous.phase%1)*durationFor(previous.mode);updateChoices()}
 const role=el('model').value,mode=el('motion').value,frames=clip(data.after,role,mode,el('direction').value)??data.after.characters[role].idle[el('direction').value],length=durationFor(mode),phase=elapsed/length,p=mode==='attack'?attackBodyPhase(phase):phase,index=(Math.floor(p*frames.length)+offset+frames.length)%frames.length,target=(index+.001)/frames.length
 let at=target;if(mode==='attack'){let lo=0,hi=1;for(let i=0;i<32;i++){const mid=(lo+hi)/2;if(attackBodyPhase(mid)<target)lo=mid;else hi=mid}at=(lo+hi)/2}elapsed=at*length
}
function updateChoices(){const role=el('model').value;for(const option of el('motion').options)option.disabled=option.value!=='sequence'&&!clip(data.after,role,option.value,'down');const ranged=el('sequence').querySelector('[value=ranged]');ranged.disabled=!clip(data.after,role,'shoot','down');if(el('motion').selectedOptions[0].disabled)el('motion').value='idle';if(ranged.disabled&&el('sequence').value==='ranged')el('sequence').value='travel';el('sequence').disabled=el('motion').value!=='sequence';for(const id of['weapon','offhand','attack-mode'])el(id).disabled=!data.after.characters[role].heldItems}
try{const response=await fetch('./catalog.json');if(!response.ok)throw Error('HTTP '+response.status);data=await response.json();for(const role of data.roles)el('model').add(new Option(roleLabels[role]??role,role));for(const mode of data.motionNames)el('motion').add(new Option(labels[mode]??mode,mode));for(const item of data.equipment){el('weapon').add(new Option(item.label,item.id));if(!item.twoHanded)el('offhand').add(new Option(item.label,item.id))}el('weapon').value='Item.RustyKnife';el('offhand').value='Item.Torch';updateAttackModes();updateChoices();await loadRole();requestAnimationFrame(render)}catch(error){el('status').textContent='동작을 불러오지 못했습니다: '+error.message}
for(const id of['model','direction','motion','sequence','weapon','offhand','attack-mode'])el(id).addEventListener('change',()=>{elapsed=0;updateChoices();if(id==='weapon')updateAttackModes();if(['model','weapon','offhand'].includes(id))loadRole()})
el('play').onclick=()=>{playing=!playing;el('play').textContent=playing?'일시 정지':'재생'};el('previous').onclick=()=>step(-1);el('next').onclick=()=>step(1);el('scrub').addEventListener('input',()=>{pause();elapsed=Math.min(.999999,Number(el('scrub').value)/1000)*position().duration})
</script></html>
