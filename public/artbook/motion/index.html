<!doctype html>
<html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>ASHVEIL · 동작 비교</title>
<style>
:root{color-scheme:dark;font-family:system-ui,sans-serif;background:#17191b;color:#d6cebb}*{box-sizing:border-box}body{margin:0}main{max-width:1250px;margin:auto;padding:28px}h1{font:29px Georgia,serif;letter-spacing:2px}p{font-size:14px;line-height:1.7;max-width:1060px;color:#b8b2a4}a{color:#d6bc81}.controls{display:flex;gap:12px;flex-wrap:wrap;align-items:center;margin:24px 0}label{font-size:13px;display:flex;gap:8px;align-items:center}select,button{background:#2d3031;border:1px solid #746b55;color:#e4d7bb;padding:8px 12px;font:inherit}button{cursor:pointer}input{accent-color:#c6ab70}.scrub{flex:1;min-width:230px}.scrub input{flex:1}.stages{display:grid;grid-template-columns:1fr 1fr;gap:16px}.stage{border:1px solid #58574c;background:#26292b;min-width:0}.stage h2{font:17px Georgia,serif;margin:0;padding:14px;border-bottom:1px solid #514e43}.stage canvas{display:block;width:100%;height:auto;image-rendering:pixelated}.stat{padding:12px;font:12px/1.7 ui-monospace,monospace;color:#bcb39d;min-height:64px}.foot{font-size:12px;color:#97978d;margin-top:22px}.status{min-height:24px}@media(max-width:650px){main{padding:16px}.stages{gap:12px;grid-template-columns:1fr}.stage h2{font-size:14px;padding:10px}.stat{padding:8px;font-size:10px}.controls{gap:9px}select,button{padding:7px}h1{font-size:24px}}
</style>
<main><h1>ASHVEIL · 동작 비교</h1><p>이전 포즈와 새 포즈를 같은 속도로 재생합니다. 방향과 행동을 바꾸거나 연결 동작을 골라 발의 교대, 준비 자세, 회복과 정지를 살펴볼 수 있습니다.</p><p><a href="../../">게임 실행</a> · <a href="../">원화 도감</a> · <a href="https://github.com/RoastFried-RF/ashveil/blob/main/docs/animation-v322.md">제작 기록</a></p>
<div class="controls"><label>캐릭터<select id="model"></select></label><label>방향<select id="direction"><option value="down">앞</option><option value="left">왼쪽</option><option value="right">오른쪽</option><option value="up">뒤</option></select></label><label>동작<select id="motion"><option value="sequence">연결 동작</option></select></label><label>연결<select id="sequence"><option value="travel">걷기 → 정지</option><option value="combat">공격 → 방어·피격 → 회복</option><option value="crouch">웅크림 → 이동 → 서기</option><option value="work">작업 → 사용 → 정지</option><option value="ground">쓰러짐 → 수면 → 기상</option><option value="ranged">조준·사격 → 던지기</option></select></label></div>
<div class="controls"><button id="play" type="button">일시 정지</button><button id="previous" type="button">한 프레임 전</button><button id="next" type="button">한 프레임 뒤</button><label>속도<select id="speed"><option value="0.25">0.25배</option><option value="0.5">0.5배</option><option value="1" selected>1배</option><option value="2">2배</option></select></label><label class="scrub">진행<input id="scrub" type="range" min="0" max="1000" value="0"><output id="progress">0%</output></label></div>
<p id="status" class="status" aria-live="polite">원화를 불러오는 중…</p><div class="stages"><section class="stage"><h2>이전 · v0.321</h2><canvas id="before" width="600" height="500" aria-label="이전 캐릭터 동작"></canvas><div id="before-stat" class="stat"></div></section><section class="stage"><h2>현재 · v0.322</h2><canvas id="after" width="600" height="500" aria-label="개선한 캐릭터 동작"></canvas><div id="after-stat" class="stat"></div></section></div>
<p class="foot">원화와 동작 연결을 보는 미리보기입니다. 실제 게임의 시간·시야·물품은 바꾸지 않습니다. 이전에 전용 포즈가 없던 행동은 정지 포즈로 표시하며 실제 게임의 조명·장비·피격 효과와는 구분합니다.</p></main>
<script type="module">
const el=id=>document.getElementById(id),labels={idle:'정지·호흡',walk:'걷기',attack:'근접 공격',block:'방어·받아넘김',hurt:'피격·회복',crouchDown:'웅크리기',crouchWalk:'웅크려 걷기',stand:'서기',work:'작업',use:'물품 사용',fall:'쓰러짐',rise:'일어나기',sleep:'수면',shoot:'조준·사격',throw:'던지기',interact:'상호작용'},roleLabels={wanderer:'떠돌이',guard:'경비',reaver:'약탈자',worker:'노동자',healer:'치료사',trader:'상인',patient:'그늘 사람',spore:'감염 순례자',hound:'재늑대',amalgam:'융합체',drone:'수리 드론',rat:'굴쥐',leech:'늪거머리'}
const sequences={travel:[['idle',500],['walk',1800],['idle',800]],combat:[['idle',450],['attack',280],['block',220],['attack',280],['hurt',240],['idle',700]],crouch:[['idle',450],['crouchDown',180],['crouchWalk',1800],['stand',180],['idle',650]],work:[['idle',400],['work',2100],['use',650],['idle',650]],ground:[['idle',450],['fall',420],['sleep',2400],['rise',360],['idle',700]],ranged:[['idle',450],['shoot',340],['idle',250],['throw',340],['interact',380],['idle',700]]}
const base=new URL('../../',location.href),images=new Map();let data,elapsed=0,last=0,playing=true,loading=0
const clip=(set,role,mode,dir)=>set.characters[role]?.[mode]?.[dir]??set.characters[role]?.motions?.[mode]?.[dir]
function timeline(){const mode=el('motion').value;return mode==='sequence'?sequences[el('sequence').value]:[[mode,data.motionDurations[mode]]]}
function position(){const line=timeline(),duration=line.reduce((n,row)=>n+row[1],0);let at=((elapsed%duration)+duration)%duration;for(const[mode,length]of line){if(at<length)return{mode,phase:at/(data.motionDurations[mode]??length),duration};at-=length}return{mode:'idle',phase:0,duration}}
async function texture(path){if(images.has(path))return images.get(path);const img=new Image();images.set(path,img);loading++;el('status').textContent='선택한 원화를 불러오는 중…';img.src=new URL(path,base).href;try{await img.decode()}catch{el('status').textContent='원화를 불러오지 못했습니다.'}finally{loading--}return img}
async function loadRole(){const role=el('model').value;for(const set of[data.before,data.after]){const c=set.characters[role],keys=new Set();for(const block of[c.walk,c.idle,c.attack,...Object.values(c.motions??{})])if(block)for(const frames of Object.values(block))for(const key of frames)keys.add(set.frames[key][0]);await Promise.all([...keys].map(key=>texture(set.sheets[key])))}if(!loading)el('status').textContent='발 기준은 같은 위치에 고정됩니다. 1배는 게임의 기본 재생 시간입니다.'}
function draw(set,name,mode,phase){
 const role=el('model').value,dir=el('direction').value,c=set.characters[role],original=clip(set,role,mode,dir),frames=original??c.idle[dir],loop=['idle','walk','crouchWalk','work','sleep'].includes(mode),p=loop?phase%1:Math.min(.999999,phase),index=Math.min(frames.length-1,Math.floor(p*frames.length)),key=frames[index],f=set.frames[key],transform=c.frameTransforms?.[key],anchor=transform?.anchor??c.anchor,scale=transform?.scale??c.renderScale??.72,img=images.get(set.sheets[f[0]]),canvas=el(name),ctx=canvas.getContext('2d'),zoom=Math.min(8,310/(c.headOffset??33)),x=300,y=380
 ctx.clearRect(0,0,600,500);ctx.fillStyle='#272a2c';ctx.fillRect(0,0,600,500);ctx.strokeStyle='#404340';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(40,y+.5);ctx.lineTo(560,y+.5);ctx.moveTo(x+.5,35);ctx.lineTo(x+.5,430);ctx.stroke();ctx.fillStyle='#a28c5e';ctx.fillRect(x-3,y-1,6,3)
 if(img?.complete&&img.naturalWidth){ctx.imageSmoothingEnabled=false;ctx.save();ctx.translate(x,y);ctx.scale(transform?.flipX?-1:1,1);ctx.drawImage(img,f[1],f[2],f[3],f[4],-anchor[0]*f[3]*scale*zoom,-anchor[1]*f[4]*scale*zoom,f[3]*scale*zoom,f[4]*scale*zoom);ctx.restore()}
 el(name+'-stat').textContent=`${labels[mode]} · ${original?frames.length+'프레임':'전용 포즈 없음'} · ${index+1}/${frames.length}`
 canvas.dataset.mode=mode;canvas.dataset.key=key;canvas.dataset.count=String(original?frames.length:0);canvas.dataset.index=String(index)
}
function render(now){if(data){if(last&&playing)elapsed+=Math.min(48,now-last)*Number(el('speed').value);const pos=position();draw(data.before,'before',pos.mode,pos.phase);draw(data.after,'after',pos.mode,pos.phase);el('scrub').value=String((elapsed%pos.duration)/pos.duration*1000);el('progress').textContent=Math.floor(Number(el('scrub').value)/10)+'%'}last=now;requestAnimationFrame(render)}
function pause(){playing=false;el('play').textContent='재생'}
function step(offset){pause();const previous=position();if(el('motion').value==='sequence'){el('motion').value=previous.mode;elapsed=Math.min(.999999,previous.phase%1)*data.motionDurations[previous.mode];updateChoices()}const role=el('model').value,mode=el('motion').value,frames=clip(data.after,role,mode,el('direction').value)??data.after.characters[role].idle[el('direction').value],duration=data.motionDurations[mode];elapsed=(Math.floor(elapsed/duration*frames.length)+offset+frames.length)%frames.length/frames.length*duration}
function updateChoices(){const role=el('model').value;for(const option of el('motion').options)option.disabled=option.value!=='sequence'&&!clip(data.after,role,option.value,'down');const ranged=el('sequence').querySelector('[value=ranged]');ranged.disabled=!clip(data.after,role,'shoot','down');if(el('motion').selectedOptions[0].disabled)el('motion').value='idle';if(ranged.disabled&&el('sequence').value==='ranged')el('sequence').value='travel';el('sequence').disabled=el('motion').value!=='sequence'}
try{const response=await fetch('./catalog.json');if(!response.ok)throw Error('HTTP '+response.status);data=await response.json();for(const role of data.roles)el('model').add(new Option(roleLabels[role]??role,role));for(const mode of data.motionNames)el('motion').add(new Option(labels[mode]??mode,mode));updateChoices();await loadRole();requestAnimationFrame(render)}catch(error){el('status').textContent='동작을 불러오지 못했습니다: '+error.message}
for(const id of['model','direction','motion','sequence'])el(id).addEventListener('change',()=>{elapsed=0;updateChoices();if(id==='model')loadRole()})
el('play').onclick=()=>{playing=!playing;el('play').textContent=playing?'일시 정지':'재생'};el('previous').onclick=()=>step(-1);el('next').onclick=()=>step(1);el('scrub').addEventListener('input',()=>{pause();elapsed=Math.min(.999999,Number(el('scrub').value)/1000)*position().duration})
</script></html>
