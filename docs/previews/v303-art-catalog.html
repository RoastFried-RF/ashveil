const LABELS={items:'물품',terrains:'지형·오브젝트',creatures:'캐릭터·적',abilities:'능력',ui:'UI'};
const state={kind:'items',page:0,size:48,query:'',zoom:3,dir:'down',mode:'idle',animate:false};
const images={},drawers=[];let tick=0;
const el=(tag,cls,text)=>{const x=document.createElement(tag);if(cls)x.className=cls;if(text!==undefined)x.textContent=text;return x};
function draw(entry,canvas,variant=0){
 let url,rect;
 if(entry.url){url=entry.url;rect=entry.rect}else{
  let key=entry.frame;
  if(entry.variants){const v=entry.variants[variant],pose=v.poses[state.mode]||v.poses.idle,fs=pose[state.dir];key=fs[state.animate?Math.floor(tick/150)%fs.length:0]}
  const f=DATA.frames[key];if(!f)throw Error('프레임 없음 '+key);url=DATA.sheets[f[0]];rect=entry.rect?[f[1]+entry.rect[0],f[2]+entry.rect[1],entry.rect[2],entry.rect[3]]:f.slice(1)
 }
 const [x,y,w,h]=rect,scale=Math.max(1,Math.min(state.zoom,Math.floor(192/w),Math.floor(156/h)));canvas.width=w*scale;canvas.height=h*scale;
 const ctx=canvas.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.clearRect(0,0,canvas.width,canvas.height);ctx.drawImage(images[url],x,y,w,h,0,0,canvas.width,canvas.height)
}
function render(){
 for(const button of document.querySelectorAll('#tabs button'))button.setAttribute('aria-pressed',String(button.dataset.kind===state.kind));
 const all=DATA.rows.filter(r=>r.kind===state.kind&&(!state.query||(r.id+' '+r.label).toLowerCase().includes(state.query.toLowerCase()))),pages=Math.max(1,Math.ceil(all.length/state.size));state.page=Math.min(state.page,pages-1);
 document.getElementById('count').textContent=LABELS[state.kind]+' '+all.length+'개 · '+(state.page+1)+' / '+pages+'쪽';document.getElementById('prev').disabled=state.page===0;document.getElementById('next').disabled=state.page===pages-1;
 const grid=document.getElementById('grid');grid.replaceChildren();drawers.length=0;
 for(const entry of all.slice(state.page*state.size,(state.page+1)*state.size)){
  const card=el('article','card');card.dataset.id=entry.id;card.append(el('h2','',entry.label),el('div','id',entry.id));const box=el('div','preview'),canvas=el('canvas');canvas.setAttribute('role','img');canvas.setAttribute('aria-label',entry.label+' 원본');box.append(canvas);card.append(box);let variant=0;
  if(entry.variants&&entry.variants.length>1){const select=el('select','variant');select.setAttribute('aria-label',entry.label+' 모습');for(const v of entry.variants)select.append(el('option','',v.key));select.addEventListener('change',()=>{variant=select.selectedIndex;draw(entry,canvas,variant)});card.append(select)}
  if(entry.note)card.append(el('p','note',entry.note));grid.append(card);const redraw=()=>draw(entry,canvas,variant);drawers.push(redraw);redraw()
 }
 window.__artCatalogStats={ready:true,kind:state.kind,page:state.page,total:all.length,rendered:drawers.length,counts:DATA.counts,networkRequired:false};
}
for(const [kind,label]of Object.entries(LABELS)){const button=el('button','',label+' '+DATA.counts[kind]);button.dataset.kind=kind;button.addEventListener('click',()=>{state.kind=kind;state.page=0;render()});document.getElementById('tabs').append(button)}
document.getElementById('search').addEventListener('input',e=>{state.query=e.target.value;state.page=0;render()});
for(const key of ['zoom','dir','mode'])document.getElementById(key).addEventListener('change',e=>{state[key]=key==='zoom'?Number(e.target.value):e.target.value;render()});
document.getElementById('animate').addEventListener('change',e=>{state.animate=e.target.checked;render()});
document.getElementById('prev').addEventListener('click',()=>{state.page--;render()});document.getElementById('next').addEventListener('click',()=>{state.page++;render()});
Promise.all(Object.entries(DATA.images).map(([url,src])=>new Promise((done,fail)=>{const im=new Image;im.onload=()=>{images[url]=im;done()};im.onerror=()=>fail(Error('이미지 없음 '+url));im.src=src}))).then(()=>{render();requestAnimationFrame(function loop(t){tick=t;if(state.animate&&state.kind==='creatures')for(const draw of drawers)draw();requestAnimationFrame(loop)})}).catch(error=>{document.getElementById('grid').textContent=error.message;throw error});
</script></body></html>
