<!doctype html><html lang="ko"><meta charset="utf-8"><title>v386 의복 패널 원문</title><style>body{background:#20261f;color:#d0c4a6;font:14px system-ui;margin:20px}h1{font-size:22px}p{line-height:1.5}canvas{display:block;image-rendering:pixelated}strong{color:#e0ba79}</style><h1>v386 · 독립 봉제 옷감 패널8 / 원문 편집0</h1><p>몸·피부·골반 없는 의복 후보입니다. <strong>관측 LEFT=row2col1+row3col2, RIGHT=row2col2+row3col1</strong>으로 개별 재매핑하며 원문 회전/반전0입니다. anatomical owner는 null/추정입니다. 완성 바지 아이템·착용/방어/출시승인은 false입니다.</p><canvas id="review"></canvas><script type="module">
const d=await fetch('panel-sources.json').then(r=>r.json()),image=new Image();image.src=d.source;await image.decode();const c=document.getElementById('review');c.width=1440;c.height=1510;const ctx=c.getContext('2d');ctx.imageSmoothingEnabled=false;ctx.fillStyle='#20261f';ctx.fillRect(0,0,c.width,c.height);const names={down:'FRONT',left:'LEFT',right:'RIGHT',up:'BACK'};
for(const[ri,f]of['down','left','right','up'].entries()){ctx.fillStyle='#dfd0ae';ctx.font='18px system-ui';ctx.fillText(names[f]+' · anatomical owner=null (requested identity is not proof)',12,ri*375+26);const parts=d.parts.filter(p=>p.observedFacing===f);for(const[ci,p]of parts.entries()){const x=ci*720+12,y=ri*375+42,[sx,sy,w,h]=p.sourceCrop;ctx.fillStyle='#30392e';ctx.fillRect(x,y,696,323);for(let yy=0;yy<323;yy+=16)for(let xx=0;xx<696;xx+=16)if((xx/16+yy/16)%2===0){ctx.fillStyle='#343e32';ctx.fillRect(x+xx,y+yy,16,16)}ctx.fillStyle='#cbbd9e';ctx.font='12px system-ui';ctx.fillText(p.rawId+'   observed '+f,x+8,y+17);const scale=.86,dx=x+130,dy=y+25;ctx.drawImage(image,sx,sy,w,h,dx,dy,w*scale,h*scale);ctx.fillStyle='#b9aa8c';ctx.fillText('원문 RGBA ×0.86',x+330,y+55);for(const[s,label,yy]of[[.035,'display .035 ×1',85],[.07,'display .035 ×2',135],[.14,'display .035 ×4',200]]){ctx.drawImage(image,sx,sy,w,h,x+350,y+yy,w*s,h*s);ctx.fillText(label,x+400,y+yy+10)}for(const[n,l]of Object.entries(p.landmarks)){const xx=dx+l.crop[0]*scale,yy=dy+l.crop[1]*scale;ctx.strokeStyle=n==='kneeFoldCenter'?'#e1b472':'#8bb4a3';ctx.lineWidth=1;ctx.beginPath();ctx.arc(xx,yy,2,0,Math.PI*2);ctx.stroke()}ctx.fillStyle='#b9aa8c';ctx.fillText('기준점은 봉제물 표시 좌표 / 물리관절 아님',x+330,y+295)}}document.body.dataset.ready='true';window.v386Inspect=()=>JSON.parse(JSON.stringify(d));
</script></html>
