<!doctype html><meta charset="utf-8"><link rel="icon" href="data:,"><style>body{background:#191b1c;color:#eee;font:14px system-ui}canvas{display:block;image-rendering:pixelated}td{padding:6px;vertical-align:top}h1{font-size:18px}h2{font-size:16px}</style><h1>v372 six arthropod parts — original RGBA private review</h1><p>No alpha removal/repair, no authored full-body frame, no runtime assembly. Green: observed cap/socket candidates; pink: landmark/inferred crease.</p><div id="atlas"></div><div id="parts"></div><div id="joints"></div><script>
const img=new Image();img.src='originals/crawler-parts-v1.png';const make=(w,h)=>{let c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').imageSmoothingEnabled=false;return c};
const mark=(g,x,y,label,color)=>{g.strokeStyle=color;g.fillStyle=color;g.beginPath();g.arc(x,y,5,0,Math.PI*2);g.moveTo(x-9,y);g.lineTo(x+9,y);g.moveTo(x,y-9);g.lineTo(x,y+9);g.stroke();g.font='11px monospace';g.fillText(label,x+7,y-7)};
Promise.all([img.decode(),fetch('source-parts.json').then(r=>r.json())]).then(([,d])=>{window.reviewData=d;let a=make(1536,1024),g=a.getContext('2d');g.fillStyle='#2d3031';g.fillRect(0,0,a.width,a.height);g.drawImage(img,0,0);document.querySelector('#atlas').append(a);
window.drawParts=(markers=false,bg='#2d3031')=>{const t=document.createElement('table');for(let row=0;row<2;row++){let tr=document.createElement('tr');for(let col=0;col<3;col++){let p=d.parts[row*3+col],[x,y,w,h]=p.sourceCrop,c=make(470,490),g=c.getContext('2d'),s=Math.min(430/w,430/h,1.35),dx=(470-w*s)/2,dy=15;g.fillStyle=bg;g.fillRect(0,0,c.width,c.height);g.drawImage(img,x,y,w,h,dx,dy,w*s,h*s);if(markers)for(const [name,point]of Object.entries(p.candidateLandmarks))mark(g,dx+(point[0]-x)*s,dy+(point[1]-y)*s,name,/Condyle|coxal/.test(name)?'#71ff99':'#ff87ba');g.fillStyle=bg==='#e5dfd0'?'#101112':'#eee';g.font='13px monospace';g.fillText(p.part+' '+JSON.stringify(p.sourceCrop),8,478);let td=document.createElement('td');td.append(c);tr.append(td)}t.append(tr)}document.querySelector('#parts').replaceChildren(t);return true};window.drawParts();
let c=make(1500,540);g=c.getContext('2d');g.fillStyle='#2d3031';g.fillRect(0,0,c.width,c.height);let infos=[['upper proximal',[773,624]],['upper distal',[777,866]],['lower proximal',[1267,618]],['lower ankle inferred',[1320,813]],['middle left',[1134,284]],['middle right',[1402,284]]];for(let i=0;i<infos.length;i++){let [name,[x,y]]=infos[i],cx=(i%3)*500+250,cy=Math.floor(i/3)*270+120;g.drawImage(img,x-45,y-45,90,90,cx-100,cy-100,200,200);mark(g,cx,cy,name,i===3?'#ff87ba':'#71ff99');g.fillStyle='#eee';g.font='13px monospace';g.fillText(name,(i%3)*500+15,Math.floor(i/3)*270+250)}document.querySelector('#joints').append(c);window.reviewReady=true;window.reviewStats={originalAlphaUnmodified:true,parts:6,gameRuntime:false,assembledCreature:false};}).catch(e=>{document.body.append(String(e));throw e});
</script>
