<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>ASHVEIL 파종기 관절·작업</title><style>body{background:#171a15;color:#d6cfba;margin:24px;font:16px system-ui}button,select{padding:10px;background:#353b2c;color:inherit;border:1px solid #817b59;margin:4px}canvas{display:block;border:1px solid #7c7357;image-rendering:pixelated}p{max-width:1000px;line-height:1.7}output{display:block;margin:16px 0}</style><h1>파종기 · 네 방향 관절·작업</h1><p>게임과 같은 Pixi 관절 뷰로 방향별 원화 4부품과 작업 차체를 표시합니다. 원본 8PNG에서 고른 30영역이며, 따로 그린 보행 프레임은 0개입니다. 가려진 힙·사지 대응은 디자인 가정이며 같은3D신체를 회전한 결과가 아닙니다. 작업 차체는 정적인 차체 기준점으로 붙이며, 잘린 옆 방향 회복 원문은 닫힌 준비 원문을 명시적으로 재사용합니다. 기본 게임의 몹·물품·세계는 불러오지 않습니다.</p><p><a href="../../" style="color:#c2b88c">게임</a> · <a href="../" style="color:#c2b88c">원화 도감</a></p><button id="play">이동 재개</button><button id="reset">초기 위치</button><label>원화 방향<select id="facing"><option value="front">정면</option><option value="left">왼쪽</option><option value="right">오른쪽</option><option value="back">뒤</option></select></label><label>이동<select id="direction"><option value="0">앞</option><option value="1">우대각</option><option value="2">왼쪽</option><option value="3">뒤</option><option value="4">오른쪽</option></select></label><label>속도<select id="speed"><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><button id="work">파종 작업 자세</button><button id="replace">뷰 다시 생성</button><output id="stat"></output><div id="stage"></div><script type="module" src="./stage.ts"></script></html>
