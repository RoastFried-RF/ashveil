<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:,"><title>ASHVEIL 재나방 비행</title><style>body{background:#171a15;color:#d6cfba;margin:24px;font:16px system-ui}button,select,input{padding:10px;background:#353b2c;color:inherit;border:1px solid #817b59;margin:4px}canvas{display:block;max-width:100%;height:auto;border:1px solid #7c7357;image-rendering:pixelated}p{max-width:950px;line-height:1.7}a{color:#c2b88c}output{display:block;margin:16px 0}</style><h1>재나방 · 비행과 흩어짐</h1><p>실제 게임과 같은 표현을 사용하는 독립 원화 미리보기입니다. 한 마리의 네 날개 포즈를 모아 날립니다. 화면의 대표 그림 수와 실제 군체의 개체 수는 별도로 관리합니다.</p><p><a href="../../">게임</a> · <a href="../">원화 도감</a></p><button id="play">표현 이동</button><button id="reset">처음 위치</button><label>집결 정도 <input id="cohesion" type="range" min="0" max="100" value="100"></label><label>재생 속도 <select id="speed"><option value="0">정지</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option></select></label><output id="stat"></output><div id="stage"></div><script type="module" src="./stage.ts"></script></html>
