name: Fresh cloud verification

on:
  push:
    branches: ['cloud/ashveil-*']
  workflow_dispatch:
    inputs:
      profile:
        description: Check profile (release includes Full)
        type: choice
        options: [release, authoring]
        default: release
        required: true

permissions:
  contents: read

concurrency:
  group: ashveil-cloud-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Frozen dependencies
        run: pnpm install --frozen-lockfile
      - name: Install Chromium for this fresh runner
        run: |
          node node_modules/playwright-core/cli.js install --with-deps chromium
          node --input-type=module -e 'import {chromium} from "playwright-core"; import {appendFileSync} from "node:fs"; appendFileSync(process.env.GITHUB_ENV, "CHROMIUM_PATH=" + chromium.executablePath() + "\n")'
      - name: Verify shared lanes
        run: |
          sudo install -d -o "$(id -u)" -g "$(id -g)" /workspace/.ashveil-tools/cloud-harness/locks
          python3 tools/cloud-harness/verify-environment.py
          python3 tools/cloud-harness/verify.py --out test-results/cloud-selfcheck
          python3 tools/cloud-harness/verify.py --regressions --out test-results/cloud-regressions
      - name: Build explicit check plan
        env:
          CLOUD_PROFILE: ${{ inputs.profile || 'release' }}
        run: python3 tools/cloud-harness/plan.py --root "$GITHUB_WORKSPACE" --chromium "$CHROMIUM_PATH" --profile "$CLOUD_PROFILE" --locale --item-locale --out test-results/cloud-plan.json
      - name: Validate and run the shared queue
        run: |
          python3 tools/cloud-harness/run.py test-results/cloud-plan.json --out test-results/cloud-release --check
          python3 tools/cloud-harness/run.py test-results/cloud-plan.json --out test-results/cloud-release
      - name: Retain diagnostics and actual input screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cloud-verification-${{ github.sha }}
          path: |
            test-results/
            !test-results/**/*-world.json
            !test-results/**/*-actual.json
            !test-results/**/*-expected.json
            !test-results/**/declared-initial.json
          if-no-files-found: warn
          retention-days: 14
