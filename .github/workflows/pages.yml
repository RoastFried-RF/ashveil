name: Playable preview

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'public/**'
      - 'mods/**'
      - 'index.html'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'vite.config.ts'
      - 'tsconfig.json'
      - 'tools/sprite-validation.ts'
      - 'tools/validate-sprites.ts'
      - 'tests/sprite-assets.test.ts'
      - 'tests/bear-v348.test.ts'
      - 'tests/sower-policy.test.ts'
      - 'tests/swarm-v370.test.ts'
      - 'tests/crawler-v375.test.ts'
      - 'tests/culler-v379.test.ts'
      - 'tests/companion-care-plan.test.ts'
      - 'tests/companion-care-schedule.test.ts'
      - 'tests/medical-simulation-timing.test.ts'
      - 'tests/swarm-filter-boundary.test.ts'
      - 'tests/sower-assault.test.ts'
      - 'tests/sower-content-v364.test.ts'
      - 'tests/articulated-gait.test.ts'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm validate-defs
      - run: pnpm test
      - run: pnpm validate-sprites
      - run: pnpm build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish playable preview
        id: deployment
        uses: actions/deploy-pages@v4
